<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Walterfrosch – Cuberealm Wiki</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Press Start 2P", monospace;
            color: white;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.70)
                ),
                url("wiki.png") center center / cover fixed no-repeat;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 10;

            display: flex;
            justify-content: center;
            gap: 25px;

            padding: 18px;

            background: rgba(20, 90, 20, 0.95);
            border-bottom: 4px solid #173d17;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        nav a:hover {
            color: #7cff7c;
        }

        .profile {
            max-width: 700px;
            margin: 70px auto;
            padding: 40px;

            text-align: center;

            background: rgba(0, 0, 0, 0.78);
            border: 5px solid #3f8f3f;
            box-shadow: 0 0 0 4px #173d17;
        }

        .profile img {
            width: 180px;
            height: 180px;

            image-rendering: pixelated;

            border: 4px solid #6fcf6f;
            background: #222;
        }

        h1 {
            margin-top: 30px;
            font-size: 30px;
            color: #7cff7c;
        }

        .username {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .info {
            text-align: left;
            line-height: 2;
            font-size: 13px;
        }

        .info strong {
            color: #7cff7c;
        }

        .back {
            display: inline-block;
            margin-top: 35px;

            padding: 15px 20px;

            color: white;
            text-decoration: none;

            background: #2f7d32;
            border: 3px solid #173d17;
        }

        .back:hover {
            background: #45a049;
        }

        footer {
            text-align: center;
            padding: 25px;
            font-size: 10px;
            color: #aaa;
        }

        @media (max-width: 700px) {
            .profile {
                margin: 40px 15px;
                padding: 25px;
            }

            h1 {
                font-size: 22px;
            }

            nav {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Startseite</a>
        <a href="spieler.html">Spieler</a>
        <a href="bauwerke.html">Bauwerke</a>
        <a href="karte.html">Karte</a>
        <a href="geschichte.html">Geschichte</a>
    </nav>

    <main class="profile">

        <img
            src="https://mc-heads.net/avatar/__WalterFrosch__/180"
            alt="Minecraft Kopf von Walterfrosch"
        >

        <h1>Walterfrosch</h1>

        <div class="username">
            Minecraft: __WalterFrosch__
        </div>

        <div class="info">
            <p><strong>Spieler:</strong> Walterfrosch</p>

            <p><strong>Rolle:</strong> Admin</p>

            <p><strong>Minecraft-Name:</strong> __WalterFrosch__</p>

            <p>
                <strong>Über:</strong><br>
                WalterFrosch ist Teil des Cuberealmsteam.
            </p>
        </div>

        <a class="back" href="spieler.html">
            ← Zurück zu den Spielern
        </a>

    </main>

    <footer>
        Cuberealm Wiki
    </footer>

</body>
</html>
