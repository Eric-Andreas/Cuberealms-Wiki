<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cuberealms Wiki – Masterix</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: white;
            font-family: "Press Start 2P", monospace;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.70)
                ),
                url("wiki.png") center center / cover fixed no-repeat;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 10;

            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;

            padding: 15px;

            background: rgba(10, 20, 10, 0.90);
            border-bottom: 4px solid #111;
        }

        nav a {
            color: white;
            text-decoration: none;

            background: #3f8f3f;
            border: 3px solid #1b4d1b;

            padding: 12px 16px;

            box-shadow:
                inset 0 -4px rgba(0, 0, 0, 0.25),
                3px 3px 0 #000;

            transition: 0.15s;
        }

        nav a:hover {
            background: #55b955;
            transform: translateY(-2px);
        }

        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        .profile {
            text-align: center;

            background: rgba(0, 20, 0, 0.85);

            border: 4px solid #111;

            padding: 40px;

            box-shadow:
                0 0 0 3px #3f8f3f,
                10px 10px 0 #000;
        }

        .profile img {
            width: 180px;
            height: 180px;

            image-rendering: pixelated;

            border: 5px solid #111;

            background: #222;

            box-shadow: 7px 7px 0 #000;

            margin-bottom: 25px;
        }

        h1 {
            margin: 10px 0 20px;

            color: #66ff66;

            font-size: 28px;
            line-height: 1.5;

            text-shadow: 4px 4px 0 #000;
        }

        .username {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 25px;
        }

        .role {
            display: inline-block;

            background: #3f8f3f;

            border: 3px solid #1b4d1b;

            padding: 14px 20px;

            font-size: 11px;

            box-shadow: 4px 4px 0 #000;

            margin-bottom: 30px;
        }

        .info {
            font-size: 11px;
            line-height: 2;

            color: #ddd;
        }

        .back {
            display: inline-block;

            margin-top: 30px;

            padding: 14px 20px;

            color: white;
            text-decoration: none;

            background: #3f8f3f;

            border: 3px solid #1b4d1b;

            box-shadow: 4px 4px 0 #000;

            font-size: 10px;
        }

        .back:hover {
            background: #55b955;
        }

        footer {
            margin-top: 60px;

            padding: 25px;

            text-align: center;

            background: rgba(0, 0, 0, 0.75);

            border-top: 4px solid #111;

            font-size: 9px;
            line-height: 1.8;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 20px;
            }

            .profile {
                padding: 25px;
            }

            .profile img {
                width: 140px;
                height: 140px;
            }

            nav a {
                font-size: 9px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">🏠 Startseite</a>
        <a href="spieler.html">👥 Spieler</a>
        <a href="bauwerke.html">🏗️ Bauwerke</a>
        <a href="karte.html">🗺️ Karte</a>
        <a href="fraktionen.html">⚔️ Fraktionen</a>
    </nav>

    <main>

        <section class="profile">

            <img
                src="https://mc-heads.net/avatar/MAsterix11/180"
                alt="Masterix Minecraft Skin"
            >

            <h1>Masterix</h1>

            <div class="username">
                Minecraft: MAsterix11
            </div>

            <div class="role">
                Developer
            </div>

            <div class="info">
                Masterix ist der wichtigste Coder von Cuberealm.
            </div>

            <a class="back" href="spieler.html">
                ← Zurück zu den Spielern
            </a>

        </section>

    </main>

    <footer>
        © 2026 Cuberealm Wiki<br>
        Eine Minecraft-Fanseite
    </footer>

</body>
</html>
